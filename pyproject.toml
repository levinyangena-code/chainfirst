[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainfirst"
version = "0.1.0"
description = "Victim-first crypto theft incident response and tracing toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ChainFirst" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
chainfirst = "chainfirst.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
